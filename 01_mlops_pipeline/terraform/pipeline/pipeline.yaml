# PIPELINE DEFINITION
# Name: isolation-forest-anomaly-pipeline
# Description: Pipeline that trains an Isolation Forest anomaly detection model and deploys it to a Gemini Enterprise Agent Platform Endpoint
# Inputs:
#    bigquery_table_uri: str [Default: '']
#    endpoint_display_name: str
#    model_display_name: str
#    model_output_gcs_uri: str
#    predict_schema_gcs_uri: str
#    project_id: str
#    region: str
#    serving_container_image_uri: str
#    skew_threshold: float
#    training_data_gcs_uri: str
components:
  comp-configure-model-monitoring:
    executorLabel: exec-configure-model-monitoring
    inputDefinitions:
      parameters:
        endpoint_display_name:
          parameterType: STRING
        model_display_name:
          parameterType: STRING
        project_id:
          parameterType: STRING
        region:
          parameterType: STRING
        skew_threshold:
          parameterType: NUMBER_DOUBLE
        training_data_gcs_uri:
          parameterType: STRING
  comp-deploy-model-to-endpoint:
    executorLabel: exec-deploy-model-to-endpoint
    inputDefinitions:
      parameters:
        endpoint_display_name:
          parameterType: STRING
        model_display_name:
          parameterType: STRING
        model_gcs_uri:
          parameterType: STRING
        project_id:
          parameterType: STRING
        region:
          parameterType: STRING
        serving_container_image_uri:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-prepare-training-data:
    executorLabel: exec-prepare-training-data
    inputDefinitions:
      parameters:
        bigquery_table_uri:
          parameterType: STRING
        prepared_data_output_gcs_uri:
          parameterType: STRING
        project_id:
          parameterType: STRING
        static_training_data_gcs_uri:
          parameterType: STRING
  comp-train-isolation-forest:
    executorLabel: exec-train-isolation-forest
    inputDefinitions:
      parameters:
        model_output_gcs_uri:
          parameterType: STRING
        training_data_gcs_uri:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-configure-model-monitoring:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - configure_model_monitoring
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform>=1.60.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef configure_model_monitoring(\n    project_id: str,\n    region:\
          \ str,\n    model_display_name: str,\n    endpoint_display_name: str,\n\
          \    training_data_gcs_uri: str,\n    skew_threshold: float,\n):\n    from\
          \ google.cloud import aiplatform\n    from google.cloud import aiplatform_v1beta1\n\
          \n    # Initialize client for regional endpoint\n    client_options = {\"\
          api_endpoint\": f\"{region}-aiplatform.googleapis.com\"}\n    mm_client\
          \ = aiplatform_v1beta1.ModelMonitoringServiceClient(client_options=client_options)\n\
          \    schedule_client = aiplatform_v1beta1.ScheduleServiceClient(client_options=client_options)\n\
          \n    # Initialize standard SDK\n    aiplatform.init(project=project_id,\
          \ location=region)\n\n    # 1. Resolve Model Registry name\n    models =\
          \ aiplatform.Model.list(\n        filter=f'display_name=\"{model_display_name}\"\
          ',\n        order_by=\"create_time desc\"\n    )\n    if not models:\n \
          \       raise ValueError(f\"Model '{model_display_name}' not found.\")\n\
          \    model_resource_name = models[0].resource_name\n\n    # 2. Resolve Endpoint\
          \ name\n    endpoints = aiplatform.Endpoint.list(\n        filter=f'display_name=\"\
          {endpoint_display_name}\"',\n        order_by=\"create_time desc\"\n   \
          \ )\n    if not endpoints:\n        raise ValueError(f\"Endpoint '{endpoint_display_name}'\
          \ not found.\")\n    endpoint = endpoints[0]\n    endpoint_resource_name\
          \ = endpoint.resource_name\n\n    monitor_display_name = f\"{model_display_name}-monitor\"\
          \n    schedule_display_name = f\"{model_display_name}-skew-schedule\"\n\
          \    parent_path = f\"projects/{project_id}/locations/{region}\"\n\n   \
          \ # 3. Delete existing Schedule if it exists to allow recreating with the\
          \ new ModelMonitor\n    list_schedules_req = aiplatform_v1beta1.ListSchedulesRequest(parent=parent_path)\n\
          \    for schedule in schedule_client.list_schedules(request=list_schedules_req):\n\
          \        if schedule.display_name == schedule_display_name:\n          \
          \  print(f\"Deleting existing Schedule targeting older model: {schedule.name}\"\
          )\n            schedule_client.delete_schedule(name=schedule.name)\n\n \
          \   # 4. Delete existing ModelMonitor if it exists to allow recreating targeting\
          \ the new model version\n    list_monitors_req = aiplatform_v1beta1.ListModelMonitorsRequest(parent=parent_path)\n\
          \    for monitor in mm_client.list_model_monitors(request=list_monitors_req):\n\
          \        if monitor.display_name == monitor_display_name:\n            print(f\"\
          Deleting existing ModelMonitor targeting older model: {monitor.name}\")\n\
          \            operation = mm_client.delete_model_monitor(name=monitor.name)\n\
          \            operation.result()\n\n    # 5. Create new ModelMonitor targeting\
          \ the newly trained model version\n    print(f\"Creating ModelMonitor: {monitor_display_name}\
          \ targeting version {models[0].version_id}...\")\n\n    # Define Schema\
          \ (feature order mapping for array predictions)\n    mm_schema = aiplatform_v1beta1.ModelMonitoringSchema(\n\
          \        feature_fields=[\n            aiplatform_v1beta1.ModelMonitoringSchema.FieldSchema(name=\"\
          feature1\", data_type=\"float\"),\n            aiplatform_v1beta1.ModelMonitoringSchema.FieldSchema(name=\"\
          feature2\", data_type=\"float\")\n        ]\n    )\n\n    model_monitor\
          \ = aiplatform_v1beta1.ModelMonitor(\n        display_name=monitor_display_name,\n\
          \        model_monitoring_target=aiplatform_v1beta1.ModelMonitor.ModelMonitoringTarget(\n\
          \            vertex_model=aiplatform_v1beta1.ModelMonitor.ModelMonitoringTarget.VertexModelSource(\n\
          \                model=model_resource_name,\n                model_version_id=models[0].version_id\n\
          \            )\n        ),\n        model_monitoring_schema=mm_schema,\n\
          \        training_dataset=aiplatform_v1beta1.ModelMonitoringInput(\n   \
          \         columnized_dataset=aiplatform_v1beta1.ModelMonitoringInput.ModelMonitoringDataset(\n\
          \                gcs_source=aiplatform_v1beta1.ModelMonitoringInput.ModelMonitoringDataset.ModelMonitoringGcsSource(\n\
          \                    gcs_uri=training_data_gcs_uri,\n                  \
          \  format_=aiplatform_v1beta1.ModelMonitoringInput.ModelMonitoringDataset.ModelMonitoringGcsSource.DataFormat.CSV\n\
          \                )\n            )\n        ),\n        notification_spec=aiplatform_v1beta1.ModelMonitoringNotificationSpec(\n\
          \            email_config=aiplatform_v1beta1.ModelMonitoringNotificationSpec.EmailConfig(\n\
          \                user_emails=[\"darenwkt@google.com\"]\n            ),\n\
          \            enable_cloud_logging=True\n        )\n    )\n\n    create_monitor_req\
          \ = aiplatform_v1beta1.CreateModelMonitorRequest(\n        parent=parent_path,\n\
          \        model_monitor=model_monitor\n    )\n    operation = mm_client.create_model_monitor(request=create_monitor_req)\n\
          \    monitor_res = operation.result()\n    existing_monitor_name = monitor_res.name\n\
          \    print(f\"Successfully created ModelMonitor: {existing_monitor_name}\"\
          )\n\n    # 6. Create Schedule since the older one was deleted\n    if True:\n\
          \n        print(f\"Creating Schedule for 15-minute intervals: {schedule_display_name}...\"\
          )\n\n        # Define Tabular Objective Spec\n        objective_spec = aiplatform_v1beta1.ModelMonitoringObjectiveSpec(\n\
          \            baseline_dataset=aiplatform_v1beta1.ModelMonitoringInput(\n\
          \                columnized_dataset=aiplatform_v1beta1.ModelMonitoringInput.ModelMonitoringDataset(\n\
          \                    gcs_source=aiplatform_v1beta1.ModelMonitoringInput.ModelMonitoringDataset.ModelMonitoringGcsSource(\n\
          \                        gcs_uri=training_data_gcs_uri,\n              \
          \          format_=aiplatform_v1beta1.ModelMonitoringInput.ModelMonitoringDataset.ModelMonitoringGcsSource.DataFormat.CSV\n\
          \                    )\n                )\n            ),\n            target_dataset=aiplatform_v1beta1.ModelMonitoringInput(\n\
          \                vertex_endpoint_logs=aiplatform_v1beta1.ModelMonitoringInput.VertexEndpointLogs(\n\
          \                    endpoints=[endpoint_resource_name]\n              \
          \  )\n            ),\n            tabular_objective=aiplatform_v1beta1.ModelMonitoringObjectiveSpec.TabularObjective(\n\
          \                feature_drift_spec=aiplatform_v1beta1.ModelMonitoringObjectiveSpec.DataDriftSpec(\n\
          \                    features=[\"feature1\", \"feature2\"],\n          \
          \          numeric_metric_type=\"jensen_shannon_divergence\",\n        \
          \            default_numeric_alert_condition=aiplatform_v1beta1.ModelMonitoringAlertCondition(\n\
          \                        threshold=skew_threshold\n                    )\n\
          \                )\n            )\n        )\n\n        job_request = aiplatform_v1beta1.CreateModelMonitoringJobRequest(\n\
          \            parent=existing_monitor_name,\n            model_monitoring_job=aiplatform_v1beta1.ModelMonitoringJob(\n\
          \                display_name=f\"{model_display_name}-monitoring-run\",\n\
          \                model_monitoring_spec=aiplatform_v1beta1.ModelMonitoringSpec(\n\
          \                    objective_spec=objective_spec\n                )\n\
          \            )\n        )\n\n        # Define Cron Schedule (every 15 minutes)\n\
          \        schedule_spec = aiplatform_v1beta1.Schedule(\n            display_name=schedule_display_name,\n\
          \            cron=\"*/15 * * * *\",\n            max_concurrent_run_count=1,\n\
          \            create_model_monitoring_job_request=job_request\n        )\n\
          \n        create_schedule_req = aiplatform_v1beta1.CreateScheduleRequest(\n\
          \            parent=parent_path,\n            schedule=schedule_spec\n \
          \       )\n        schedule_res = schedule_client.create_schedule(request=create_schedule_req)\n\
          \        print(f\"Successfully created Schedule: {schedule_res.name}\")\n\
          \n"
        image: us-docker.pkg.dev/vertex-ai/training/sklearn-cpu.1-6:latest
    exec-deploy-model-to-endpoint:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - deploy_model_to_endpoint
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef deploy_model_to_endpoint(\n    project_id: str,\n    region:\
          \ str,\n    model_display_name: str,\n    endpoint_display_name: str,\n\
          \    model_gcs_uri: str,\n    serving_container_image_uri: str,\n) -> str:\n\
          \    from google.cloud import aiplatform\n\n    aiplatform.init(project=project_id,\
          \ location=region)\n\n    # Check if endpoint exists, otherwise create it\n\
          \    endpoints = aiplatform.Endpoint.list(\n        filter=f'display_name=\"\
          {endpoint_display_name}\"',\n        order_by=\"create_time desc\"\n   \
          \ )\n\n    if endpoints:\n        endpoint = endpoints[0]\n        print(f\"\
          Found existing endpoint: {endpoint.resource_name}\")\n    else:\n      \
          \  print(f\"Creating new endpoint: {endpoint_display_name}\")\n        endpoint\
          \ = aiplatform.Endpoint.create(\n            display_name=endpoint_display_name,\n\
          \            project=project_id,\n            location=region\n        )\n\
          \        print(f\"Created endpoint: {endpoint.resource_name}\")\n\n    #\
          \ Register/Upload the model to Model Registry\n    # Check if a model with\
          \ the same display name exists to create a new version\n    models = aiplatform.Model.list(\n\
          \        filter=f'display_name=\"{model_display_name}\"',\n        order_by=\"\
          create_time desc\"\n    )\n\n    parent_model = models[0].resource_name\
          \ if models else None\n\n    print(f\"Uploading model to registry: {model_display_name}\"\
          )\n    uploaded_model = aiplatform.Model.upload(\n        display_name=model_display_name,\n\
          \        artifact_uri=model_gcs_uri,\n        serving_container_image_uri=serving_container_image_uri,\n\
          \        parent_model=parent_model,\n        is_default_version=True,\n\
          \    )\n    print(f\"Uploaded model: {uploaded_model.resource_name}\")\n\
          \n    # Deploy the model to the endpoint.\n    # Note: For simplicity and\
          \ continuous delivery, we route 100% traffic to the new model\n    # and\
          \ undeploy older models deployed to this endpoint.\n    print(f\"Deploying\
          \ model to endpoint {endpoint.resource_name} with deployed_model_id {deployed_model_id}...\"\
          )\n\n    # List currently deployed models to undeploy them later\n    deployed_models_to_remove\
          \ = endpoint.list_models()\n\n    # Deploy the new model\n    endpoint.deploy(\n\
          \        model=uploaded_model,\n        deployed_model_display_name=model_display_name,\n\
          \        traffic_percentage=100,\n        machine_type=\"n1-standard-2\"\
          , # Minimum machine type for Gemini Enterprise Agent Platform predictions\n\
          \        min_replica_count=1,\n        max_replica_count=1,\n    )\n   \
          \ print(\"Model deployed successfully.\")\n\n    # Undeploy older models\
          \ to clean up resources\n    # We keep only the model we just deployed (which\
          \ matches the new model resource name)\n    for deployed_model in endpoint.list_models():\n\
          \        if deployed_model.model != uploaded_model.resource_name:\n    \
          \        print(f\"Undeploying old model deployment ID: {deployed_model.id}\
          \ (Model: {deployed_model.model})\")\n            endpoint.undeploy(deployed_model_id=deployed_model.id)\n\
          \n    print(\"Cleanup of older deployed models completed.\")\n\n    # Find\
          \ and return the newly deployed model ID\n    new_deployed_model_id = None\n\
          \    for deployed_model in endpoint.list_models():\n        if deployed_model.model\
          \ == uploaded_model.resource_name and deployed_model.model_version_id ==\
          \ uploaded_model.version_id:\n            new_deployed_model_id = deployed_model.id\n\
          \            break\n\n    if not new_deployed_model_id:\n        raise ValueError(\"\
          Could not find the newly deployed model ID on the endpoint.\")\n\n    print(f\"\
          Newly deployed model ID: {new_deployed_model_id}\")\n    return new_deployed_model_id\n\
          \n"
        image: us-docker.pkg.dev/vertex-ai/training/sklearn-cpu.1-6:latest
    exec-prepare-training-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - prepare_training_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-bigquery'\
          \ 'db-dtypes'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef prepare_training_data(\n    project_id: str,\n    static_training_data_gcs_uri:\
          \ str,\n    bigquery_table_uri: str,\n    prepared_data_output_gcs_uri:\
          \ str,\n):\n    from google.cloud import bigquery\n    from google.cloud\
          \ import storage\n    import pandas as pd\n    from urllib.parse import\
          \ urlparse\n    import os\n\n    fallback = False\n    if bigquery_table_uri\
          \ and bigquery_table_uri.strip():\n        print(f\"Preparing data from\
          \ BigQuery table: {bigquery_table_uri} in project {project_id}\")\n    \
          \    try:\n            client = bigquery.Client(project=project_id)\n  \
          \          query = f\"\"\"\n                SELECT\n                  CAST(SPLIT(TRIM(payload,\
          \ '[]'), ',')[OFFSET(0)] AS FLOAT64) AS feature1,\n                  CAST(SPLIT(TRIM(payload,\
          \ '[]'), ',')[OFFSET(1)] AS FLOAT64) AS feature2\n                FROM\n\
          \                  `{bigquery_table_uri}`,\n                  UNNEST(request_payload)\
          \ AS payload\n                WHERE\n                  logging_time >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(),\
          \ INTERVAL 30 DAY)\n            \"\"\"\n            print(f\"Running query:\\\
          n{query}\")\n            df_bq = client.query(query).to_dataframe()\n  \
          \          print(f\"Query returned {len(df_bq)} rows.\")\n            if\
          \ len(df_bq) == 0:\n                print(\"Warning: BigQuery returned 0\
          \ rows. Falling back to static training data.\")\n                fallback\
          \ = True\n            else:\n                # Combine static baseline data\
          \ and new BigQuery logging data\n                print(f\"Loading static\
          \ baseline data from {static_training_data_gcs_uri}\")\n               \
          \ df_static = pd.read_csv(static_training_data_gcs_uri)\n              \
          \  df = pd.concat([df_static, df_bq], ignore_index=True)\n             \
          \   print(f\"Combined dataset has {len(df)} total rows.\")\n        except\
          \ Exception as e:\n            print(f\"Error querying BigQuery: {e}. Falling\
          \ back to static training data.\")\n            fallback = True\n    else:\n\
          \        print(\"No BigQuery table provided. Preparing data from static\
          \ GCS URI.\")\n        fallback = True\n\n    if fallback:\n        print(f\"\
          Copying static training data from {static_training_data_gcs_uri} to {prepared_data_output_gcs_uri}\"\
          )\n        df = pd.read_csv(static_training_data_gcs_uri)\n\n    parsed_url\
          \ = urlparse(prepared_data_output_gcs_uri)\n    bucket_name = parsed_url.netloc\n\
          \    blob_path = parsed_url.path.lstrip(\"/\")\n\n    storage_client = storage.Client()\n\
          \    bucket = storage_client.bucket(bucket_name)\n    blob = bucket.blob(blob_path)\n\
          \n    csv_data = df.to_csv(index=False)\n    blob.upload_from_string(csv_data,\
          \ content_type=\"text/csv\")\n    print(f\"Prepared training data saved\
          \ to {prepared_data_output_gcs_uri}\")\n\n"
        image: us-docker.pkg.dev/vertex-ai/training/sklearn-cpu.1-6:latest
    exec-train-isolation-forest:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_isolation_forest
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_isolation_forest(\n    training_data_gcs_uri: str,\n  \
          \  model_output_gcs_uri: str,\n):\n    import pandas as pd\n    from sklearn.ensemble\
          \ import IsolationForest\n    import joblib\n    from google.cloud import\
          \ storage\n    from urllib.parse import urlparse\n    import os\n\n    print(f\"\
          Loading training data from {training_data_gcs_uri}\")\n    df = pd.read_csv(training_data_gcs_uri)\n\
          \n    # Train the Isolation Forest model\n    # Assuming all columns except\
          \ potentially a label or ID are features.\n    # In unsupervised anomaly\
          \ detection, we train only on the features.\n    print(\"Training Isolation\
          \ Forest model...\")\n    model = IsolationForest(n_estimators=100, contamination=0.05,\
          \ random_state=42)\n    model.fit(df)\n\n    # Save the model locally\n\
          \    model_filename = \"model.joblib\"\n    joblib.dump(model, model_filename)\n\
          \    print(f\"Saved model locally to {model_filename}\")\n\n    # Upload\
          \ to Cloud Storage\n    parsed_url = urlparse(model_output_gcs_uri)\n  \
          \  bucket_name = parsed_url.netloc\n    blob_path = parsed_url.path.lstrip(\"\
          /\")\n\n    # Ensure blob path ends with a slash to treat it as a directory,\
          \ then append filename\n    if blob_path and not blob_path.endswith(\"/\"\
          ):\n        blob_path += \"/\"\n    dest_blob_name = os.path.join(blob_path,\
          \ model_filename)\n\n    print(f\"Uploading model to gs://{bucket_name}/{dest_blob_name}\"\
          )\n    storage_client = storage.Client()\n    bucket = storage_client.bucket(bucket_name)\n\
          \    blob = bucket.blob(dest_blob_name)\n    blob.upload_from_filename(model_filename)\n\
          \n    print(\"Model upload completed successfully.\")\n\n"
        image: us-docker.pkg.dev/vertex-ai/training/sklearn-cpu.1-6:latest
pipelineInfo:
  description: Pipeline that trains an Isolation Forest anomaly detection model and
    deploys it to a Gemini Enterprise Agent Platform Endpoint
  name: isolation-forest-anomaly-pipeline
root:
  dag:
    tasks:
      configure-model-monitoring:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-configure-model-monitoring
        dependentTasks:
        - deploy-model-to-endpoint
        inputs:
          parameters:
            endpoint_display_name:
              componentInputParameter: endpoint_display_name
            model_display_name:
              componentInputParameter: model_display_name
            project_id:
              componentInputParameter: project_id
            region:
              componentInputParameter: region
            skew_threshold:
              componentInputParameter: skew_threshold
            training_data_gcs_uri:
              componentInputParameter: training_data_gcs_uri
        taskInfo:
          name: configure-model-monitoring
      deploy-model-to-endpoint:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-deploy-model-to-endpoint
        dependentTasks:
        - train-isolation-forest
        inputs:
          parameters:
            endpoint_display_name:
              componentInputParameter: endpoint_display_name
            model_display_name:
              componentInputParameter: model_display_name
            model_gcs_uri:
